<body><header class="topbar"><a class="brand" href="index.html"><span class="brand-mark">✦</span><span>ପରିଚୟ <small>2026</small></span></a><span class="eyebrow">02 • PERSONALIZE</span></header>
<main class="page"><div style="width:100%"><div class="section-title"><div class="eyebrow">MAKE IT YOURS</div><h1>Create your <span>invitation</span></h1><p>Enter your name and add your photograph. Your personalized card will be ready in the next step.</p></div>
<div class="card"><label for="studentName">Your name</label><input id="studentName" class="input" maxlength="36" placeholder="e.g. Priyanka Das" autocomplete="name">
<label for="photoInput">Your photograph</label><label class="upload" for="photoInput"><input id="photoInput" type="file" accept="image/*"><strong>＋ Choose a photo</strong><small>JPG, PNG or WEBP • portrait photo recommended</small></label>
<div class="mini"><div class="avatar" id="miniAvatar">PHOTO</div><div><strong id="miniName">Your Name</strong><p>Photo and name are processed in your browser.</p></div></div>
<button id="continueBtn" class="primary" style="width:100%;border:0">Continue to my invitation →</button></div>
<div class="btns"><a class="ghost" href="index.html">← Back</a></div></div></main><script src="script.js"></script></body></html>
